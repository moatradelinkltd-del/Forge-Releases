name: Sign Forge Update Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.pending.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sign-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Sigstore
        run: python -m pip install 'sigstore==4.5.0'

      - name: Validate and canonicalize pending manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          pending_path = Path('manifest.pending.json')
          if not pending_path.exists():
              raise SystemExit('manifest.pending.json is missing.')
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          version = str(pending.get('version', '')).strip()
          sha256 = str(pending.get('sha256', '')).strip().lower()
          download_url = str(pending.get('download_url', '')).strip()
          notes = str(pending.get('notes', '')).strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid Forge version: {version!r}')
          if not re.fullmatch(r'[0-9a-f]{64}', sha256):
              raise SystemExit('Invalid SHA-256 in pending manifest.')
          parsed = urlparse(download_url)
          expected_path = f'/moatradelinkltd-del/Forge-Releases/releases/download/v{version}/Forge-{version}.zip'
          if parsed.scheme != 'https' or parsed.netloc.lower() != 'github.com' or parsed.path != expected_path:
              raise SystemExit('Pending manifest download URL is outside the trusted Forge release path.')
          payload = {
              'download_url': download_url,
              'notes': notes,
              'sha256': sha256,
              'version': version,
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          Path('manifest.payload.json').write_bytes(canonical)
          with open('/tmp/forge-signing.env', 'w', encoding='utf-8') as handle:
              handle.write(f'VERSION={version}\n')
              handle.write(f'BUNDLE=Forge-manifest-{version}.sigstore.json\n')
          PY
          cat /tmp/forge-signing.env >> "$GITHUB_ENV"

      - name: Sign canonical manifest with Sigstore
        shell: bash
        run: |
          python -m sigstore sign --bundle "$BUNDLE" --overwrite manifest.payload.json
          python -m sigstore verify github manifest.payload.json \
            --bundle "$BUNDLE" \
            --repository moatradelinkltd-del/Forge-Releases \
            --name 'Sign Forge Update Manifest' \
            --ref refs/heads/main

      - name: Upload signature bundle to Forge release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "v$VERSION" "$BUNDLE" --clobber

      - name: Publish signed manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('manifest.payload.json').read_text(encoding='utf-8'))
          version = payload['version']
          payload.update({
              'signature_type': 'sigstore',
              'signature_bundle_url': f'https://github.com/moatradelinkltd-del/Forge-Releases/releases/download/v{version}/Forge-manifest-{version}.sigstore.json',
              'signature_repository': 'moatradelinkltd-del/Forge-Releases',
              'signature_workflow': 'Sign Forge Update Manifest',
              'signature_ref': 'refs/heads/main',
              'signature_issuer': 'https://token.actions.githubusercontent.com',
          })
          Path('manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then
            echo 'Signed manifest is already current.'
          else
            git commit -m "Publish signed Forge manifest $VERSION"
            git push
          fi
