name: Sign Forge Update Manifest
run-name: Sign Forge manifest ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.pending.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sign-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Sigstore
        run: python -m pip install --disable-pip-version-check 'sigstore==4.5.0'

      - name: Validate and canonicalize pending manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          pending_path = Path('manifest.pending.json')
          if not pending_path.exists():
              raise SystemExit('manifest.pending.json is missing.')
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          version = str(pending.get('version', '')).strip()
          sha256 = str(pending.get('sha256', '')).strip().lower()
          download_url = str(pending.get('download_url', '')).strip()
          notes = str(pending.get('notes', '')).strip()
          request_id = str(pending.get('request_id', '')).strip()
          source_commit = str(pending.get('source_commit', '')).strip().lower()

          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid Forge version: {version!r}')
          if not re.fullmatch(r'[0-9a-f]{64}', sha256):
              raise SystemExit('Invalid SHA-256 in pending manifest.')
          if not re.fullmatch(r'[0-9a-f]{40}', source_commit):
              raise SystemExit('Invalid source commit in pending manifest.')
          if not re.fullmatch(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}', request_id):
              raise SystemExit('Invalid request ID in pending manifest.')

          parsed = urlparse(download_url)
          expected_path = f'/moatradelinkltd-del/Forge-Releases/releases/download/v{version}/Forge-{version}.zip'
          if parsed.scheme != 'https' or parsed.netloc.lower() != 'github.com' or parsed.path != expected_path:
              raise SystemExit('Pending manifest download URL is outside the trusted Forge release path.')

          payload = {
              'download_url': download_url,
              'notes': notes,
              'sha256': sha256,
              'version': version,
          }

          # Forge 6.9 adds optional signed Linux package metadata. Keeping this
          # field conditional preserves the exact historical canonical payload
          # for 6.8 and earlier manifests.
          if 'linux_packages' in pending:
              packages = pending.get('linux_packages')
              if not isinstance(packages, dict) or set(packages) != {'amd64', 'arm64'}:
                  raise SystemExit('linux_packages must contain exactly amd64 and arm64 entries.')
              normalized_packages = {}
              for arch in ('amd64', 'arm64'):
                  item = packages.get(arch)
                  if not isinstance(item, dict):
                      raise SystemExit(f'Linux package entry {arch!r} must be an object.')
                  package_sha = str(item.get('sha256', '')).strip().lower()
                  package_url = str(item.get('download_url', '')).strip()
                  if not re.fullmatch(r'[0-9a-f]{64}', package_sha):
                      raise SystemExit(f'Invalid SHA-256 for Linux package {arch}.')
                  parsed_package = urlparse(package_url)
                  expected_package_path = (
                      f'/moatradelinkltd-del/Forge-Releases/releases/download/v{version}/'
                      f'Forge-{version}-linux-{arch}.deb'
                  )
                  if (
                      parsed_package.scheme != 'https'
                      or parsed_package.netloc.lower() != 'github.com'
                      or parsed_package.path != expected_package_path
                  ):
                      raise SystemExit(f'Linux package URL for {arch} is outside the trusted Forge release path.')
                  normalized_packages[arch] = {
                      'download_url': package_url,
                      'sha256': package_sha,
                  }
              payload['linux_packages'] = normalized_packages

          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          Path('manifest.payload.json').write_bytes(canonical)
          with open('/tmp/forge-signing.env', 'w', encoding='utf-8') as handle:
              handle.write(f'VERSION={version}\n')
              handle.write(f'BUNDLE=Forge-manifest-{version}.sigstore.json\n')
          PY
          cat /tmp/forge-signing.env >> "$GITHUB_ENV"

      - name: Sign canonical manifest with Sigstore
        shell: bash
        run: |
          python -m sigstore sign manifest.payload.json
          mv manifest.payload.json.sigstore.json "$BUNDLE"
          python -m sigstore verify github manifest.payload.json \
            --bundle "$BUNDLE" \
            --repository moatradelinkltd-del/Forge-Releases \
            --name 'Sign Forge Update Manifest' \
            --ref refs/heads/main

      - name: Upload signature bundle to Forge release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "v$VERSION" "$BUNDLE" --clobber

      - name: Publish signed manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('manifest.payload.json').read_text(encoding='utf-8'))
          version = payload['version']
          payload.update({
              'signature_type': 'sigstore',
              'signature_bundle_url': f'https://github.com/moatradelinkltd-del/Forge-Releases/releases/download/v{version}/Forge-manifest-{version}.sigstore.json',
              'signature_repository': 'moatradelinkltd-del/Forge-Releases',
              'signature_workflow': 'Sign Forge Update Manifest',
              'signature_ref': 'refs/heads/main',
              'signature_issuer': 'https://token.actions.githubusercontent.com',
          })
          Path('manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then
            echo 'Signed manifest is already current.'
          else
            git commit -m "Publish signed Forge manifest $VERSION"
            git push
          fi
